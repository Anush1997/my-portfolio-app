<section id="contact" class="contact-section">
  <div class="container">
    <h2 class="section-title">Get In Touch</h2>
    
    <div class="contact-content">
      <div class="contact-info">
        <h3>Let's Connect</h3>
        <p>I'm currently looking for new opportunities. Whether you have a question or just want to say hi, I'll try my best to get back to you!</p>
        
        <div class="info-items">
          <div class="item">
            <i class="fas fa-envelope"></i>
            <span>{{ email }}</span>
          </div>
          <div class="item">
            <i class="fas fa-phone"></i>
            <span>{{ phone }}</span>
          </div>
          <div class="item">
            <i class="fas fa-map-marker-alt"></i>
            <span>{{ location }}</span>
          </div>
        </div>
        
        <div class="social-links">
          <a href="https://www.linkedin.com/in/udaya-anushanka" target="_blank"><i class="fab fa-linkedin"></i></a>
          <a href="mailto:beligahamullage@gmail.com"><i class="fas fa-envelope"></i></a>
          <a href="https://github.com/Anush1997" target="_blank"><i class="fab fa-github"></i></a>
        </div>
      </div>
      
        <form class="contact-form" (ngSubmit)="sendMessage()" #contactForm="ngForm">
          <div class="form-group">
            <input type="text" name="name" [(ngModel)]="name" placeholder="Your Name" required>
          </div>

          <div class="form-group">
            <input type="email" name="email" [(ngModel)]="userEmail" placeholder="Your Email" required>
          </div>

          <div class="form-group">
            <textarea name="message" [(ngModel)]="message" placeholder="Your Message" rows="5" required></textarea>
          </div>

          <button type="submit" class="btn">Send Message</button>
        </form>
    </div>
  </div>
</section>
